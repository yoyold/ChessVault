name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued deploy finish rather than
# cancelling it — a cancelled deploy can leave Pages serving a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Quality gates run before the build so a broken commit never reaches Pages.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Resolve base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          # User/org sites (`<name>.github.io`) are served from the domain root
          # and must NOT get a prefix; project sites are served from /<repo>.
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A deployment an earlier run gave up on can stay open on GitHub's side
      # and refuse every later one ("in progress deployment, please cancel").
      # Runs never overlap (see `concurrency`), so whatever is still in
      # progress when this job starts is such a leftover, and is cancelled.
      - name: Cancel Pages deployments left in progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          api() {
            curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }
          for sha in $(api "https://api.github.com/repos/$REPO/commits?sha=$BRANCH&per_page=10" | jq -r '.[].sha'); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            status=$(api "https://api.github.com/repos/$REPO/pages/deployments/$sha" | jq -r '.status // empty')
            echo "$sha: ${status:-no Pages deployment}"
            case "$status" in
              deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn)
                echo "Cancelling the Pages deployment of $sha, left at $status"
                api -X POST "https://api.github.com/repos/$REPO/pages/deployments/$sha/cancel"
                ;;
            esac
          done

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages sometimes takes longer than the default ten minutes to report
          # back. Giving up then leaves the deployment open on GitHub's side,
          # where it blocks the next one until it finally completes; waiting
          # longer lets it finish and the queued run deploy after it.
          timeout: 1800000
